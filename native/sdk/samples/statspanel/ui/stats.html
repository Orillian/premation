<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layer Stats</title>
<link rel="stylesheet" href="stats.css">
</head>
<body>
  <h1>Layer Stats</h1>
  <p id="comp" class="hint">No composition.</p>
  <ul id="kinds" class="kinds"></ul>
  <ol id="layers" class="layers"></ol>
  <div class="row">
    <input id="prefix" type="text" value="Shot" aria-label="Name prefix">
    <button id="number" type="button" class="primary">Number selected</button>
  </div>
  <p id="status" class="hint" role="status"></p>
  <script src="stats.js"></script>
</body>
</html>
